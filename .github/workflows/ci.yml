name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # `@cartograph/config` validates env at import and exits if it's
      # missing, so any test that transitively imports it (graph, tools,
      # api) needs these present. They're placeholders, not secrets — CI
      # has no CognoDB, so tests that actually need a reachable DB (the one
      # live case in the api e2e) skip themselves when the connection fails.
      - run: pnpm run test
        env:
          COGNODB_URI: bolt://localhost:7687
          COGNODB_USER: neo4j
          COGNODB_PASSWORD: ci-placeholder
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: ci-placeholder

  docker:
    name: build api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — proves the Dockerfile (incl. the git install) is valid.
      # Registry push + deploy to Azure Container Apps is wired in Phase 4.
      - name: Build apps/api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: cartograph-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
